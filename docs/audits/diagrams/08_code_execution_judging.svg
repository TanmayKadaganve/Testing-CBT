        <text x="16" y="24" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="700" fill="#0f172a">5. Test Case Comparison</text>
        <text x="16" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#64748b">Compare stdout vs expected_output\nPoints, TLE, RE, WA, AC</text>
    </g>
    
    <path d="M 300 165 L 250 165" stroke="#64748b" stroke-width="1.5" stroke-dasharray="0" marker-end="url(#arrow)"/>
    
    
    <g transform="translate(50,130)">
