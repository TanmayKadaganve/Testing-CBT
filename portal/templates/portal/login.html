{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="{% static 'portal/images/pyforgelabs-logo.png' %}">
  <title>PyForgeLabs - Candidate Login</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { min-height: 100vh; margin: 0; padding: 28px; display: grid; place-items: center;
           background: #f3f6fa; color: #172435; font-family: Arial, Helvetica, sans-serif; }
    .login-shell { display: grid; grid-template-columns: 1fr 1fr; width: min(100%, 1000px); min-height: 540px;
                   overflow: hidden; background: #fff; border: 1px solid #dce3eb; border-radius: 12px;
                   box-shadow: 0 18px 55px rgba(22, 47, 78, .12); }
    .brand-panel { display: flex; flex-direction: column; align-items: center; justify-content: center;
                   padding: 48px 36px; text-align: center; border-right: 1px solid #dce3eb;
                   background: linear-gradient(145deg, #fff 35%, #f5f8fc); }
    .brand-logo { display: block; width: 190px; height: 190px; object-fit: contain; margin-bottom: 24px; }
    .company-name { margin: 0; color: #172435; font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
    .brand-caption { margin: 10px 0 0; color: #718096; font-size: 14px; }
    .form-panel { display: flex; align-items: center; justify-content: center; padding: 48px 54px; }
    .form-card { width: 100%; max-width: 360px; }
    h1 { margin: 0 0 8px; color: #172435; font-size: 26px; }
    .intro { margin: 0 0 30px; color: #718096; font-size: 14px; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; color: #344256; font-size: 13px; font-weight: 700; }
    input { display: block; width: 100%; height: 46px; padding: 0 13px; border: 1px solid #cbd5e1;
            border-radius: 6px; background: #fff; color: #172435; font: 15px Arial, Helvetica, sans-serif; }
    input:focus { outline: 3px solid rgba(31, 111, 235, .15); border-color: #1f6feb; }
    button { width: 100%; min-height: 46px; margin-top: 26px; border: 0; border-radius: 6px;
             background: #1265d8; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
             transition: background .15s, transform .15s; }
    button:hover { background: #0b55bd; transform: translateY(-1px); }
    .error { margin-top: 14px; padding: 10px 12px; border: 1px solid #f2b8b5; border-radius: 5px;
             background: #fff2f1; color: #b42318; font-size: 14px; }
    @media (max-width: 680px) {
      body { padding: 16px; }
      .login-shell { grid-template-columns: 1fr; min-height: 0; }
      .brand-panel { padding: 28px 22px; border-right: 0; border-bottom: 1px solid #dce3eb; }
      .brand-logo { width: 92px; height: 92px; margin-bottom: 10px; }
      .company-name { font-size: 23px; }
      .brand-caption { margin-top: 5px; }
      .form-panel { padding: 32px 24px 38px; }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="brand-panel" aria-label="PyForgeLabs">
      <img class="brand-logo" src="{% static 'portal/images/pyforgelabs-logo.png' %}" alt="PyForgeLabs logo">
      <h2 class="company-name">PyForgeLabs</h2>
      <p class="brand-caption">Online Assessment Portal</p>
    </section>
    <section class="form-panel" aria-labelledby="login-title">
      <div class="form-card">
        <h1 id="login-title">Candidate login</h1>
        <p class="intro">Sign in to continue to your assessment.</p>
        <form method="post">
          {% csrf_token %}
          <label for="usn">USN</label>
          <input id="usn" type="text" name="usn" autocomplete="username" required autofocus>
          <label for="dob">Date of birth</label>
          <input id="dob" type="date" name="dob" required>
          <button type="submit">Login</button>
          {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
        </form>
      </div>
    </section>
  </main>
  <script>
    // Automatically reload if restored from browser back-forward cache (prevents stale CSRF token)
    window.addEventListener('pageshow', function(e) {
      if (e.persisted) {
        window.location.reload();
      }
    });
  </script>
</body>
</html>
