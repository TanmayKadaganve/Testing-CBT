# Replace the certificate paths with the institution's trusted TLS certificate.
upstream cbt_app_server {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=cbt_login_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cbt_integrity_limit:10m rate=30r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ exam.cbt.college.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name exam.cbt.college.lan;

    ssl_certificate /etc/ssl/certs/cbt_college.crt;
    ssl_certificate_key /etc/ssl/private/cbt_college.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 15M;
    client_body_buffer_size 128k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 65;

    access_log /var/log/nginx/cbt_access.log combined buffer=16k flush=5s;
    error_log /var/log/nginx/cbt_error.log warn;

    location /static/ {
        alias /var/www/cbt/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    location = / {
        limit_req zone=cbt_login_limit burst=20 nodelay;
        proxy_pass http://cbt_app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /recruitment/integrity/event/ {
        limit_req zone=cbt_integrity_limit burst=5 nodelay;
        proxy_pass http://cbt_app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /recruitment/integrity-event/ {
        limit_req zone=cbt_integrity_limit burst=5 nodelay;
        proxy_pass http://cbt_app_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://cbt_app_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 45s;
    }
}
